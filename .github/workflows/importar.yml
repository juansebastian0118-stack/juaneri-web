name: Importar sitio
on:
  push:
    paths:
      - '.github/workflows/importar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar archivos del sitio
        run: |
          B=https://splitlukas--tfr2e7yaoh.expo.app/juaneri-web
          rm -f img/cashflow.webp
          for f in index.html styles.css favicon.png CNAME img/gymtrack.webp img/cashflow-resumen.webp img/cashflow-mes.webp img/splitlukas.webp img/splitlukas-icon.png splitlukas/index.html splitlukas/privacidad.html splitlukas/soporte.html; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$B/$f" -o "$f"
          done
      - name: Guardar en el repositorio
        run: |
          git config user.name "Juaneri"
          git config user.email "juan.falla.g@juaneri.com"
          git add -A
          git commit -m "Sitio de Juaneri: capturas nuevas de Cash Flow" || echo "Sin cambios"
          git push
