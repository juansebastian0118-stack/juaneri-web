name: Importar sitio
on: push
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar archivos
        run: |
          B=https://splitlukas--hviu3c8qdm.expo.app/juaneri-web
          for f in index.html styles.css splitlukas/index.html splitlukas/privacidad.html splitlukas/soporte.html img/proto-bienvenida.webp img/proto-inicio.webp img/proto-grupo.webp img/proto-gasto.webp img/proto-saldar.webp img/proto-premium.webp; do
            mkdir -p "$(dirname "$f")"; curl -fsSL "$B/$f" -o "$f"
          done
          git rm -q --ignore-unmatch img/splitlukas.webp
          git config user.name "Juaneri"
          git config user.email "juan.falla.g@juaneri.com"
          git add -A
          git commit -m "Logo estilo Cash Flow y pantallas del prototipo de SplitLukas" || echo "sin cambios"
          git push
