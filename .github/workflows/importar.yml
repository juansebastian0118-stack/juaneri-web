name: Importar sitio
on: push
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar archivos
        run: |
          curl -fsSL "https://splitlukas--tp4k7p58fe.expo.app/tmpweb/favicon.png" -o favicon.png
          git rm -q .github/workflows/importar.yml
          git config user.name "Juaneri"
          git config user.email "juan.falla.g@juaneri.com"
          git add -A
          git commit -m "Icono de pestaña: moneda partida con el signo $" || echo "sin cambios"
          git push
